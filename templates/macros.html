{# Shared markup helpers used across the app's templates. #}

{% macro scrollable_table(headers, rows) %}
<div class="table-wrapper">
    <table class="data-table">
        <thead>
            <tr>
            {% for header in headers %}
                <th>{{ header }}</th>
            {% endfor %}
            </tr>
        </thead>
        <tbody>
        {% for row in rows %}
            <tr>
            {% for cell in row %}
                <td>{{ cell }}</td>
            {% endfor %}
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endmacro %}
